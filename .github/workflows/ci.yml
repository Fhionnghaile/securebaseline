name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "31 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  lint-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
      - name: validate examples
        run: |
          for d in examples/*/; do terraform -chdir="$d" init -backend=false && terraform -chdir="$d" validate; done
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - run: tflint --recursive
      - uses: aquasecurity/trivy-action@0.35.0   # safe release after the March 2026 tag compromise (CVE-2026-33634)
        with: { scan-type: config, scan-ref: ., severity: HIGH,CRITICAL, exit-code: "1" }
      - uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v12
        with: { directory: . }
